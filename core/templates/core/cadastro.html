{% extends 'core/base.html' %}

{% block content %}
<div class="bg-white p-5 rounded-3 shadow-sm border">
    <h2 class="text-success mb-4"><i class="fa-solid fa-file-signature"></i> Efetuar Cadastro</h2>
    
    <!-- Formulário agora configurado para enviar dados por POST -->
    <form method="POST">
        {% csrf_token %} <!-- Código de segurança obrigatório do Django -->
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Nome do Cliente</label>
                <!-- Atributo name="nome" adicionado -->
                <input type="text" name="nome" class="form-control" required placeholder="Ex: João Silva">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Número do Processo</label>
                <!-- Atributo name="numero" adicionado -->
                <input type="text" name="numero" class="form-control" required placeholder="0000000-00.0000.0.00.0000">
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold">Situação Atual</label>
            <!-- Atributo name="status" adicionado -->
            <select name="status" class="form-select">
                <option value="Ativo">Ativo</option>
                <option value="Suspenso">Suspenso</option>
                <option value="Concluído">Concluído</option>
            </select>
        </div>
        <!-- Botão alterado para type="submit" para submeter o formulário -->
        <button type="submit" class="btn btn-success btn-lg"><i class="fa-solid fa-save"></i> Guardar Registo</button>
        <a href="/" class="btn btn-outline-secondary btn-lg ms-2">Cancelar</a>
    </form>
</div>
{% endblock %}
