<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Jurídico Fácil</title>
    <!-- Bootstrap para o design e FontAwesome para ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <!-- Menu de Navegação Global -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-scale-balanced text-primary"></i> Gestor Jurídico</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cadastro/">Cadastros</a></li>
                    <li class="nav-item"><a class="nav-link" href="/consulta/">Consultas</a></li>
                </ul>
                <a href="/admin/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-gear"></i> Administração</a>
            </div>
        </div>
    </nav>

    <!-- Área onde o conteúdo de cada página vai aparecer -->
    <main class="container mt-5">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
